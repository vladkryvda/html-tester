<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewport Simulator & Editor</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --border: #27272a;
      --text: #a1a1aa;
      --text-active: #fafafa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Blocks selection only while dragging splitter */
    body.is-resizing,
    body.is-resizing * {
      user-select: none !important;
      -webkit-user-select: none !important;
    }
    body.is-resizing iframe {
      pointer-events: none !important;
    }

    header {
      height: 48px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--surface);
      font-size: 13px;
      flex-shrink: 0;
    }

    .controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn {
      background: #18181b;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      color: var(--text-active);
      border-color: #3f3f46;
    }

    .btn.active {
      background: #27272a;
      color: var(--text-active);
      border-color: #52525b;
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .dim-label {
      font-size: 11px;
      color: #71717a;
      font-family: monospace;
      margin-left: 8px;
    }

    main {
      flex: 1;
      display: flex;
      height: calc(100vh - 48px);
      overflow: hidden;
      flex-direction: row;
    }

    main.layout-stacked {
      flex-direction: column;
    }

    .editor-pane {
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    main.layout-stacked .editor-pane {
      width: 100%;
      height: 50%;
    }

    textarea {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: #d4d4d8;
      border: none;
      padding: 16px;
      font-family: "JetBrains Mono", Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: none;
      outline: none;
      tab-size: 2;
    }

    /* Тонка 1px лінія розділювача з комфортною зоною захоплення */
    .resizer {
      background-color: var(--border);
      flex-shrink: 0;
      z-index: 20;
      position: relative;
      transition: background-color 0.15s ease;
    }

    .resizer:hover,
    body.is-resizing .resizer {
      background-color: #3b82f6;
    }

    main:not(.layout-stacked) .resizer {
      width: 1px;
      height: 100%;
      cursor: col-resize;
    }

    /* Невидима область натискання (8px) для горизонтального розділювача */
    main:not(.layout-stacked) .resizer::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: -4px;
      right: -4px;
      cursor: col-resize;
      z-index: 1;
    }

    main.layout-stacked .resizer {
      height: 1px;
      width: 100%;
      cursor: row-resize;
    }

    /* Невидима область натискання (8px) для вертикального розділювача */
    main.layout-stacked .resizer::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: -4px;
      bottom: -4px;
      cursor: row-resize;
      z-index: 1;
    }

    .preview-pane {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090b;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    .device-scaler {
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }

    .device-wrapper {
      position: relative;
      border: 2px solid #3f3f46;
      border-radius: 44px;
      background: #000;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .device-notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 22px;
      background: #000;
      border-radius: 14px;
      z-index: 10;
      border: 1px solid #1c1c1f;
      pointer-events: none;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #09090b;
      color-scheme: dark;
      border-radius: 42px;
      pointer-events: auto !important;
    }

    .preview-pane.is-desktop {
      padding: 0;
      background: #09090b;
    }

    .is-desktop .device-scaler {
      width: 100%;
      height: 100%;
      transform: none !important;
    }

    .is-desktop .device-wrapper {
      width: 100% !important;
      height: 100% !important;
      border: none;
      border-radius: 0;
      box-shadow: none;
      background: #09090b;
    }

    .is-desktop .device-notch {
      display: none !important;
    }

    .is-desktop iframe {
      border-radius: 0;
      background: #09090b;
    }

    .preview-pane:fullscreen {
      padding: 0 !important;
      margin: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: #000 !important;
    }

    .preview-pane:fullscreen .device-scaler,
    .preview-pane:fullscreen .device-wrapper,
    .preview-pane:fullscreen iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      transform: none !important;
    }

    .preview-pane:fullscreen .device-notch {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="controls">
      <button class="btn active" data-type="desktop">Desktop</button>
      <button class="btn" data-type="mobile" data-w="375" data-h="812">iPhone 13 mini</button>
      <button class="btn" data-type="mobile" data-w="393" data-h="852">iPhone 15/16 Pro</button>
      <button class="btn" data-type="mobile" data-w="360" data-h="800">Android Base</button>
      <button class="btn" id="rotate-btn" disabled>Rotate</button>
      <span class="dim-label" id="dimensions-display">Desktop (Full Width)</span>
    </div>

    <div class="controls">
      <button class="btn" id="fullscreen-btn" title="View Fullscreen Without UI">⛶ Fullscreen</button>
      <button class="btn" id="layout-btn">Layout: Side-by-Side</button>
    </div>
  </header>

  <main id="main-layout">
    <section class="editor-pane" id="editor-container">
      <textarea id="code-input" spellcheck="false" placeholder="Paste your HTML/CSS code here..."></textarea>
    </section>

    <div class="resizer" id="resizer"></div>

    <section class="preview-pane is-desktop" id="preview-container">
      <div class="device-scaler" id="scaler">
        <div class="device-wrapper" id="device">
          <div class="device-notch" id="notch"></div>
          <iframe id="viewport-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
        </div>
      </div>
    </section>
  </main>

  <script>
    const mainLayout = document.getElementById('main-layout');
    const editorContainer = document.getElementById('editor-container');
    const editor = document.getElementById('code-input');
    const resizer = document.getElementById('resizer');
    const iframe = document.getElementById('viewport-frame');
    const device = document.getElementById('device');
    const scaler = document.getElementById('scaler');
    const previewContainer = document.getElementById('preview-container');
    const dimDisplay = document.getElementById('dimensions-display');
    const notch = document.getElementById('notch');
    const modeBtns = document.querySelectorAll('[data-type]');
    const rotateBtn = document.getElementById('rotate-btn');
    const layoutBtn = document.getElementById('layout-btn');
    const fullscreenBtn = document.getElementById('fullscreen-btn');

    let isDesktop = true;
    let currentW = 393;
    let currentH = 852;
    let isLandscape = false;
    let isStacked = false;

    const EMPTY_DARK_TEMPLATE = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <style>
    html, body {
      background-color: #09090b !important;
      color: #a1a1aa;
      margin: 0;
      height: 100%;
    }
  </style>
</head>
<body></body>
</html>`;

    editor.value = localStorage.getItem('sim_code_clean') || '';

    // ==========================================
    //           СИСТЕМА UNDO / REDO
    // ==========================================
    let history = [{
      value: editor.value,
      selStart: editor.selectionStart,
      selEnd: editor.selectionEnd
    }];
    let historyIndex = 0;
    let isApplyingHistory = false;
    let historyDebounceTimer = null;

    function saveHistoryState(immediate = false) {
      if (isApplyingHistory) return;

      const currentState = {
        value: editor.value,
        selStart: editor.selectionStart,
        selEnd: editor.selectionEnd
      };

      if (history[historyIndex] && history[historyIndex].value === currentState.value) {
        history[historyIndex].selStart = currentState.selStart;
        history[historyIndex].selEnd = currentState.selEnd;
        return;
      }

      const commit = () => {
        history = history.slice(0, historyIndex + 1);
        history.push(currentState);
        if (history.length > 60) {
          history.shift();
        } else {
          historyIndex++;
        }
      };

      clearTimeout(historyDebounceTimer);
      if (immediate) {
        commit();
      } else {
        historyDebounceTimer = setTimeout(commit, 350);
      }
    }

    function applyHistoryState(state) {
      if (!state) return;
      isApplyingHistory = true;
      editor.value = state.value;
      renderPreview();
      editor.focus();
      editor.setSelectionRange(state.selStart, state.selEnd);
      isApplyingHistory = false;
    }

    function undo() {
      clearTimeout(historyDebounceTimer);

      if (history[historyIndex] && editor.value !== history[historyIndex].value) {
        history = history.slice(0, historyIndex + 1);
        history.push({
          value: editor.value,
          selStart: editor.selectionStart,
          selEnd: editor.selectionEnd
        });
        historyIndex++;
      }

      if (historyIndex > 0) {
        historyIndex--;
        applyHistoryState(history[historyIndex]);
      }
    }

    function redo() {
      clearTimeout(historyDebounceTimer);
      if (historyIndex < history.length - 1) {
        historyIndex++;
        applyHistoryState(history[historyIndex]);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.fullscreenElement) {
        document.exitFullscreen();
        return;
      }

      const isModifier = e.ctrlKey || e.metaKey;

      if (isModifier) {
        if (e.code === 'KeyZ') {
          e.preventDefault();
          if (e.shiftKey) {
            redo();
          } else {
            undo();
          }
        } else if (e.code === 'KeyY') {
          e.preventDefault();
          redo();
        }
      }
    });

    // ==========================================
    //           ГОЛОВНА ЛОГІКА
    // ==========================================
    function getPreparedHtml(code) {
      const trimmed = code.trim();
      if (!trimmed) return EMPTY_DARK_TEMPLATE;

      const hasDocType = /<!doctype/i.test(trimmed);
      const hasHtmlTag = /<html[\s>]/i.test(trimmed);

      if (!hasDocType && !hasHtmlTag) {
        return `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <style>
    html, body {
      background-color: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
    }
  </style>
</head>
<body>
  ${code}
</body>
</html>`;
      }

      if (!trimmed.includes('color-scheme')) {
        return trimmed.replace(/<head[\s>]/i, '$&<meta name="color-scheme" content="dark">');
      }

      return trimmed;
    }

    function renderPreview() {
      iframe.srcdoc = getPreparedHtml(editor.value);
      localStorage.setItem('sim_code_clean', editor.value);
    }

    editor.addEventListener('input', () => {
      renderPreview();
      saveHistoryState();
    });

    // Оновлена функція з чітким 50/50 центруванням
    function applyLayout(forceSide = false) {
      if (forceSide) isStacked = false;

      if (isStacked && isDesktop) {
        mainLayout.classList.add('layout-stacked');
        layoutBtn.textContent = 'Layout: Stacked';
        editorContainer.style.width = '100%';
        editorContainer.style.height = '50%';
      } else {
        mainLayout.classList.remove('layout-stacked');
        layoutBtn.textContent = 'Layout: Side-by-Side';
        editorContainer.style.width = '50%';
        editorContainer.style.height = '100%';
      }
      layoutBtn.disabled = !isDesktop;
      fullscreenBtn.disabled = !isDesktop;
      updateView();
    }

    function updateView() {
      if (isDesktop) {
        previewContainer.classList.add('is-desktop');
        rotateBtn.disabled = true;
        rotateBtn.classList.remove('active');
        isLandscape = false;

        const w = previewContainer.clientWidth;
        const h = previewContainer.clientHeight;
        dimDisplay.textContent = `Desktop (${w} × ${h} px)`;
      } else {
        previewContainer.classList.remove('is-desktop');
        rotateBtn.disabled = false;

        const w = isLandscape ? currentH : currentW;
        const h = isLandscape ? currentW : currentH;

        device.style.width = `${w}px`;
        device.style.height = `${h}px`;
        notch.style.display = isLandscape ? 'none' : 'block';

        const availW = previewContainer.clientWidth - 40;
        const availH = previewContainer.clientHeight - 40;
        const totalW = w + 4;
        const totalH = h + 4;

        let scale = Math.min(availW / totalW, availH / totalH);
        if (scale > 1) scale = 1;

        scaler.style.transform = `scale(${scale})`;
        const pct = Math.round(scale * 100);
        dimDisplay.textContent = `${w} × ${h} px (${pct}%)`;
      }
    }

    function toggleFullscreen() {
      if (!isDesktop) return;

      if (!document.fullscreenElement) {
        previewContainer.requestFullscreen().catch(err => {
          console.warn(`Fullscreen error: ${err.message}`);
        });
      } else {
        document.exitFullscreen().catch(err => {
          console.warn(`Exit fullscreen error: ${err.message}`);
        });
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    document.addEventListener('fullscreenchange', () => {
      updateView();
    });

    // Drag-ресайзер
    let isDragging = false;

    function stopDragging() {
      if (isDragging) {
        isDragging = false;
        document.body.classList.remove('is-resizing');
      }
    }

    resizer.addEventListener('mousedown', () => {
      isDragging = true;
      document.body.classList.add('is-resizing');
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;

      if (isStacked && isDesktop) {
        const headerH = 48;
        const totalH = window.innerHeight - headerH;
        let percentage = ((e.clientY - headerH) / totalH) * 100;
        percentage = Math.max(15, Math.min(85, percentage));
        editorContainer.style.height = `${percentage}%`;
      } else {
        let percentage = (e.clientX / window.innerWidth) * 100;
        percentage = Math.max(15, Math.min(85, percentage));
        editorContainer.style.width = `${percentage}%`;
      }
      updateView();
    });

    window.addEventListener('mouseup', stopDragging);
    window.addEventListener('blur', stopDragging);

    const resizeObserver = new ResizeObserver(() => {
      updateView();
    });
    resizeObserver.observe(previewContainer);

    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        modeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if (btn.dataset.type === 'desktop') {
          isDesktop = true;
          applyLayout();
        } else {
          isDesktop = false;
          currentW = parseInt(btn.dataset.w);
          currentH = parseInt(btn.dataset.h);
          applyLayout(true);
        }
        updateView();
      });
    });

    rotateBtn.addEventListener('click', () => {
      if (isDesktop) return;
      isLandscape = !isLandscape;
      rotateBtn.classList.toggle('active', isLandscape);
      updateView();
    });

    layoutBtn.addEventListener('click', () => {
      if (!isDesktop) return;
      isStacked = !isStacked;
      applyLayout();
    });

    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        saveHistoryState(true);
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
        renderPreview();
        saveHistoryState(true);
      }
    });

    applyLayout();
    renderPreview();
  </script>
</body>
</html>
