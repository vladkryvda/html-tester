<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewport Simulator & Editor</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --border: #27272a;
      --border-subtle: #1c1c20;
      --text: #71717a;
      --text-hover: #a1a1aa;
      --text-active: #fafafa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::selection {
      background-color: #3f3f46;
      color: #fafafa;
    }
    ::-moz-selection {
      background-color: #3f3f46;
      color: #fafafa;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Блокування виділення та подій миші під час зміни розміру */
    body.is-resizing {
      cursor: col-resize !important;
      user-select: none !important;
      -webkit-user-select: none !important;
    }
    body.is-resizing.is-stacked-resizing {
      cursor: row-resize !important;
    }
    body.is-resizing * {
      user-select: none !important;
      -webkit-user-select: none !important;
      pointer-events: none !important;
    }
    body.is-resizing .resizer {
      pointer-events: auto !important;
    }
    body.is-resizing iframe {
      pointer-events: none !important;
    }

    /* ==========================================
       ВЕРХНЄ МЕНЮ (МІНІМАЛІЗМ / МОНОХРОМ)
    ========================================== */
    header {
      height: 40px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      background: var(--bg);
      flex-shrink: 0;
      z-index: 10;
    }

    /* Секція мінімалістичних вкладок */
    .tabs-wrapper {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 100%;
    }

    #tabs-container {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 22px;
      min-width: 22px;
      padding: 0 6px;
      border-radius: 4px;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 11px;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.12s ease;
      user-select: none;
    }

    .tab:hover {
      color: var(--text-hover);
      background: var(--surface);
    }

    .tab.active {
      color: var(--text-active);
      background: #18181b;
      border-color: #3f3f46;
    }

    .tab-close {
      display: none;
      margin-left: 4px;
      font-size: 12px;
      line-height: 1;
      color: #71717a;
      cursor: pointer;
    }

    .tab:hover .tab-close {
      display: inline-block;
    }

    .tab-close:hover {
      color: var(--text-active);
    }

    .btn-add-tab {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      background: transparent;
      border: 1px solid transparent;
      color: #52525b;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-add-tab:hover {
      color: var(--text-active);
      background: #18181b;
      border-color: var(--border);
    }

    /* Секція векторних інструментів */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .segmented-control {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px;
      gap: 1px;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 24px;
      background: transparent;
      border: none;
      border-radius: 3px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.12s ease;
      outline: none;
    }

    .icon-btn:hover:not(:disabled) {
      color: var(--text-active);
      background: #18181b;
    }

    .icon-btn.active {
      color: var(--text-active);
      background: #27272a;
    }

    .icon-btn:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    .device-select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-hover);
      font-size: 11px;
      height: 26px;
      border-radius: 4px;
      padding: 0 6px;
      outline: none;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.12s ease;
      display: none;
    }

    .device-select:hover {
      border-color: #3f3f46;
      color: var(--text-active);
    }

    .device-select option {
      background: #121215;
      color: var(--text-active);
    }

    .divider {
      width: 1px;
      height: 14px;
      background: var(--border);
      margin: 0 3px;
    }

    .dim-label {
      font-size: 11px;
      color: #52525b;
      font-family: "JetBrains Mono", Consolas, monospace;
      white-space: nowrap;
      user-select: none;
      padding: 0 2px;
    }

    /* ==========================================
       ОСНОВНА ОБЛАСТЬ РЕДАКТОРА ТА ПРЕВ'Ю
    ========================================== */
    main {
      flex: 1;
      display: flex;
      height: calc(100vh - 40px);
      overflow: hidden;
      flex-direction: row;
    }

    main.layout-stacked {
      flex-direction: column;
    }

    .editor-pane {
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    main.layout-stacked .editor-pane {
      width: 100%;
      height: 50%;
    }

    .editor-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      background: var(--bg);
      overflow: hidden;
    }

    /* «Примарні» номери рядків */
    .line-numbers {
      background: transparent;
      padding: 16px 6px 32px 14px;
      font-family: "JetBrains Mono", Consolas, "Courier New", monospace;
      font-size: 11px;
      line-height: 20px;
      text-align: right;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      flex-shrink: 0;
      min-width: 38px;
      box-sizing: border-box;
      cursor: default;
    }

    .line-num {
      height: 20px;
      line-height: 20px;
      color: #3f3f46;
      font-variant-numeric: tabular-nums;
      transition: color 0.12s ease;
      cursor: pointer;
    }

    .line-num:hover {
      color: var(--text-active);
    }

    .line-num.active {
      color: #a1a1aa;
      font-weight: 500;
    }

    .line-num.active:hover {
      color: var(--text-active);
    }

    textarea {
      flex: 1;
      width: 100%;
      height: 100%;
      background: transparent;
      color: #d4d4d8;
      border: none;
      padding: 16px 16px 32px 8px;
      font-family: "JetBrains Mono", Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 20px;
      resize: none;
      outline: none;
      tab-size: 2;
      white-space: pre;
      overflow-wrap: normal;
      overflow-x: auto;
      overflow-y: auto;
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: #27272a transparent;
    }

    textarea::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    textarea::-webkit-scrollbar-track {
      background: transparent;
    }

    textarea::-webkit-scrollbar-thumb {
      background: #1f1f23;
      border-radius: 3px;
    }

    textarea::-webkit-scrollbar-thumb:hover {
      background: #27272a;
    }

    /* Тонка 1px лінія розділювача */
    .resizer {
      background-color: var(--border);
      flex-shrink: 0;
      z-index: 20;
      position: relative;
    }

    main:not(.layout-stacked) .resizer {
      width: 1px;
      height: 100%;
      cursor: col-resize;
    }

    main:not(.layout-stacked) .resizer::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: -4px;
      right: -4px;
      cursor: col-resize;
      z-index: 1;
    }

    main.layout-stacked .resizer {
      height: 1px;
      width: 100%;
      cursor: row-resize;
    }

    main.layout-stacked .resizer::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: -4px;
      bottom: -4px;
      cursor: row-resize;
      z-index: 1;
    }

    .preview-pane {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #09090b;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    .device-scaler {
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }

    .device-wrapper {
      position: relative;
      border: 2px solid #3f3f46;
      border-radius: 44px;
      background: #000;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .device-notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 22px;
      background: #000;
      border-radius: 14px;
      z-index: 10;
      border: 1px solid #1c1c1f;
      pointer-events: none;
    }

    /* Повні права для 3D, Pointer Lock та повноекранного режиму */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #09090b;
      color-scheme: dark;
      border-radius: 42px;
      pointer-events: auto !important;
    }

    .preview-pane.is-desktop {
      padding: 0;
      background: #09090b;
    }

    .is-desktop .device-scaler {
      width: 100%;
      height: 100%;
      transform: none !important;
    }

    .is-desktop .device-wrapper {
      width: 100% !important;
      height: 100% !important;
      border: none;
      border-radius: 0;
      box-shadow: none;
      background: #09090b;
    }

    .is-desktop .device-notch {
      display: none !important;
    }

    .is-desktop iframe {
      border-radius: 0;
      background: #09090b;
    }

    .preview-pane:fullscreen {
      padding: 0 !important;
      margin: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: #000 !important;
    }

    .preview-pane:fullscreen .device-scaler,
    .preview-pane:fullscreen .device-wrapper,
    .preview-pane:fullscreen iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      transform: none !important;
    }

    .preview-pane:fullscreen .device-notch {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="tabs-wrapper">
      <div id="tabs-container"></div>
      <button class="btn-add-tab" id="btn-add-tab" title="Нова вкладка">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>

    <div class="header-actions">
      <div class="segmented-control">
        <button class="icon-btn active" id="btn-mode-desktop" title="Desktop Mode">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </button>
        <button class="icon-btn" id="btn-mode-mobile" title="Mobile Mode">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2.5"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
          </svg>
        </button>
      </div>

      <select class="device-select" id="device-select" title="Device Preset">
        <option value="393x852">iPhone 15/16 Pro (393×852)</option>
        <option value="375x812">iPhone 13 mini (375×812)</option>
        <option value="360x800">Android Base (360×800)</option>
        <option value="768x1024">iPad Mini (768×1024)</option>
      </select>

      <button class="icon-btn" id="rotate-btn" title="Rotate" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.9 1 6.7 2.6L21 8"></path>
          <polyline points="21 3 21 8 16 8"></polyline>
        </svg>
      </button>

      <div class="divider"></div>
      <span class="dim-label" id="dimensions-display">Desktop</span>
      <div class="divider"></div>

      <button class="icon-btn" id="layout-btn" title="Toggle Layout">
        <svg id="layout-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <line x1="12" y1="3" x2="12" y2="21"></line>
        </svg>
      </button>

      <button class="icon-btn" id="fullscreen-btn" title="Fullscreen">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </button>
    </div>
  </header>

  <main id="main-layout">
    <section class="editor-pane" id="editor-container">
      <div class="editor-wrapper">
        <div class="line-numbers" id="line-numbers" aria-hidden="true"></div>
        <textarea id="code-input" spellcheck="false" wrap="off" placeholder="Paste your HTML/CSS code here..."></textarea>
      </div>
    </section>

    <div class="resizer" id="resizer"></div>

    <section class="preview-pane is-desktop" id="preview-container">
      <div class="device-scaler" id="scaler">
        <div class="device-wrapper" id="device">
          <div class="device-notch" id="notch"></div>
          <!-- ДОДАНО allow-pointer-lock ТА Permissions Policy ДЛЯ 3D ГОР -->
          <iframe id="viewport-frame" 
                  sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-popups allow-modals allow-downloads"
                  allow="pointer-lock; fullscreen; accelerometer; gyroscope"
                  allowfullscreen="true"></iframe>
        </div>
      </div>
    </section>
  </main>

  <script>
    const mainLayout = document.getElementById('main-layout');
    const editorContainer = document.getElementById('editor-container');
    const editor = document.getElementById('code-input');
    const lineNumbers = document.getElementById('line-numbers');
    const resizer = document.getElementById('resizer');
    const iframe = document.getElementById('viewport-frame');
    const device = document.getElementById('device');
    const scaler = document.getElementById('scaler');
    const previewContainer = document.getElementById('preview-container');
    const dimDisplay = document.getElementById('dimensions-display');
    const notch = document.getElementById('notch');

    const tabsContainer = document.getElementById('tabs-container');
    const btnAddTab = document.getElementById('btn-add-tab');
    const btnModeDesktop = document.getElementById('btn-mode-desktop');
    const btnModeMobile = document.getElementById('btn-mode-mobile');
    const deviceSelect = document.getElementById('device-select');
    const rotateBtn = document.getElementById('rotate-btn');
    const layoutBtn = document.getElementById('layout-btn');
    const layoutIcon = document.getElementById('layout-icon');
    const fullscreenBtn = document.getElementById('fullscreen-btn');

    let isDesktop = true;
    let currentW = 393;
    let currentH = 852;
    let isLandscape = false;
    let isStacked = false;

    const EMPTY_DARK_TEMPLATE = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <style>
    html, body {
      background-color: #09090b !important;
      color: #a1a1aa;
      margin: 0;
      height: 100%;
    }
  </style>
</head>
<body></body>
</html>`;

    // ==========================================
    //           СИСТЕМА ВКЛАДОК (TABS)
    // ==========================================
    let tabs = [];
    let activeTabId = null;

    function initTabs() {
      const savedTabs = localStorage.getItem('sim_tabs_v2');
      const savedActiveId = localStorage.getItem('sim_active_tab_v2');

      if (savedTabs) {
        try {
          tabs = JSON.parse(savedTabs);
        } catch (e) {
          tabs = [];
        }
      }

      if (!tabs || tabs.length === 0) {
        const legacyCode = localStorage.getItem('sim_code_clean') || '';
        tabs = [
          {
            id: 'tab_1',
            code: legacyCode,
            history: [{ value: legacyCode, selStart: 0, selEnd: 0 }],
            historyIndex: 0
          }
        ];
      }

      activeTabId = savedActiveId && tabs.some(t => t.id === savedActiveId)
        ? savedActiveId
        : tabs[0].id;

      renderTabs();
      loadTabContent(activeTabId);
    }

    function getActiveTab() {
      return tabs.find(t => t.id === activeTabId) || tabs[0];
    }

    function saveTabsToStorage() {
      try {
        localStorage.setItem('sim_tabs_v2', JSON.stringify(tabs));
        localStorage.setItem('sim_active_tab_v2', activeTabId);
      } catch (err) {
        console.warn('Storage limit reached:', err);
      }
    }

    function renderTabs() {
      tabsContainer.innerHTML = '';
      if (tabs.length <= 1) return;

      tabs.forEach((tab, index) => {
        const tabEl = document.createElement('div');
        tabEl.className = `tab ${tab.id === activeTabId ? 'active' : ''}`;
        tabEl.title = `Вкладка ${index + 1}`;

        const numSpan = document.createElement('span');
        numSpan.textContent = index + 1;

        const closeBtn = document.createElement('span');
        closeBtn.className = 'tab-close';
        closeBtn.innerHTML = '&times;';
        closeBtn.title = 'Закрити';

        closeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          closeTab(tab.id);
        });

        tabEl.appendChild(numSpan);
        tabEl.appendChild(closeBtn);

        tabEl.addEventListener('click', () => {
          switchTab(tab.id);
        });

        tabsContainer.appendChild(tabEl);
      });
    }

    function switchTab(newTabId) {
      if (newTabId === activeTabId) return;

      const currentTab = getActiveTab();
      if (currentTab) {
        currentTab.code = editor.value;
        currentTab.history = history;
        currentTab.historyIndex = historyIndex;
        currentTab.selStart = editor.selectionStart;
        currentTab.selEnd = editor.selectionEnd;
      }

      activeTabId = newTabId;
      renderTabs();
      loadTabContent(newTabId);
      saveTabsToStorage();
    }

    function loadTabContent(tabId) {
      const tab = tabs.find(t => t.id === tabId) || tabs[0];
      editor.value = tab.code || '';

      history = tab.history && tab.history.length > 0 ? tab.history : [{
        value: editor.value,
        selStart: 0,
        selEnd: 0
      }];
      historyIndex = typeof tab.historyIndex === 'number' ? tab.historyIndex : 0;

      renderPreview();
      updateLineNumbers();

      if (typeof tab.selStart === 'number') {
        editor.setSelectionRange(tab.selStart, tab.selEnd);
      }
    }

    function createNewTab() {
      const newId = 'tab_' + Date.now();
      const newTab = {
        id: newId,
        code: '',
        history: [{ value: '', selStart: 0, selEnd: 0 }],
        historyIndex: 0
      };
      tabs.push(newTab);
      switchTab(newId);
      saveTabsToStorage();
    }

    function closeTab(tabId) {
      if (tabs.length <= 1) return;

      const index = tabs.findIndex(t => t.id === tabId);
      if (index === -1) return;

      tabs.splice(index, 1);

      if (activeTabId === tabId) {
        const nextIndex = Math.max(0, index - 1);
        activeTabId = tabs[nextIndex].id;
        loadTabContent(activeTabId);
      }

      renderTabs();
      saveTabsToStorage();
    }

    btnAddTab.addEventListener('click', createNewTab);

    // ==========================================
    //           СИСТЕМА НОМЕРІВ РЯДКІВ
    // ==========================================
    let lastLineCount = 0;
    let currentActiveLine = 1;

    function getCurrentLineNumber() {
      const pos = editor.selectionStart;
      const val = editor.value;
      let line = 1;
      for (let i = 0; i < pos; i++) {
        if (val.charCodeAt(i) === 10) line++;
      }
      return line;
    }

    function updateLineNumbers() {
      const lines = editor.value.split('\n').length;
      const activeLine = getCurrentLineNumber();

      if (lines !== lastLineCount) {
        lastLineCount = lines;
        let html = '';
        for (let i = 1; i <= lines; i++) {
          const isActive = i === activeLine ? ' active' : '';
          html += `<div class="line-num${isActive}">${i}</div>`;
        }
        lineNumbers.innerHTML = html;
        currentActiveLine = activeLine;
      } else if (activeLine !== currentActiveLine) {
        const children = lineNumbers.children;
        if (children[currentActiveLine - 1]) {
          children[currentActiveLine - 1].classList.remove('active');
        }
        if (children[activeLine - 1]) {
          children[activeLine - 1].classList.add('active');
        }
        currentActiveLine = activeLine;
      }
      lineNumbers.scrollTop = editor.scrollTop;
    }

    editor.addEventListener('scroll', () => {
      lineNumbers.scrollTop = editor.scrollTop;
    });

    lineNumbers.addEventListener('wheel', (e) => {
      editor.scrollTop += e.deltaY;
      e.preventDefault();
    }, { passive: false });

    lineNumbers.addEventListener('click', (e) => {
      const target = e.target.closest('.line-num');
      if (!target) return;
      const targetLine = parseInt(target.textContent, 10);
      const lines = editor.value.split('\n');
      let pos = 0;
      for (let i = 0; i < targetLine - 1 && i < lines.length; i++) {
        pos += lines[i].length + 1;
      }
      editor.focus();
      editor.setSelectionRange(pos, pos);
      updateLineNumbers();
    });

    ['keyup', 'click', 'mouseup'].forEach(evt => {
      editor.addEventListener(evt, updateLineNumbers);
    });

    // ==========================================
    //           СИСТЕМА UNDO / REDO
    // ==========================================
    let history = [{ value: '', selStart: 0, selEnd: 0 }];
    let historyIndex = 0;
    let isApplyingHistory = false;
    let historyDebounceTimer = null;

    function saveHistoryState(immediate = false) {
      if (isApplyingHistory) return;

      const currentState = {
        value: editor.value,
        selStart: editor.selectionStart,
        selEnd: editor.selectionEnd
      };

      if (history[historyIndex] && history[historyIndex].value === currentState.value) {
        history[historyIndex].selStart = currentState.selStart;
        history[historyIndex].selEnd = currentState.selEnd;
        return;
      }

      const commit = () => {
        history = history.slice(0, historyIndex + 1);
        history.push(currentState);
        if (history.length > 60) {
          history.shift();
        } else {
          historyIndex++;
        }
        const curTab = getActiveTab();
        if (curTab) {
          curTab.history = history;
          curTab.historyIndex = historyIndex;
        }
      };

      clearTimeout(historyDebounceTimer);
      if (immediate) {
        commit();
      } else {
        historyDebounceTimer = setTimeout(commit, 350);
      }
    }

    function applyHistoryState(state) {
      if (!state) return;
      isApplyingHistory = true;
      editor.value = state.value;
      const curTab = getActiveTab();
      if (curTab) curTab.code = state.value;
      schedulePreview(0);
      updateLineNumbers();
      editor.focus();
      editor.setSelectionRange(state.selStart, state.selEnd);
      isApplyingHistory = false;
      saveTabsToStorage();
    }

    function undo() {
      clearTimeout(historyDebounceTimer);
      if (history[historyIndex] && editor.value !== history[historyIndex].value) {
        history = history.slice(0, historyIndex + 1);
        history.push({
          value: editor.value,
          selStart: editor.selectionStart,
          selEnd: editor.selectionEnd
        });
        historyIndex++;
      }

      if (historyIndex > 0) {
        historyIndex--;
        applyHistoryState(history[historyIndex]);
      }
    }

    function redo() {
      clearTimeout(historyDebounceTimer);
      if (historyIndex < history.length - 1) {
        historyIndex++;
        applyHistoryState(history[historyIndex]);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.fullscreenElement) {
        document.exitFullscreen();
        return;
      }

      const isModifier = e.ctrlKey || e.metaKey;
      if (isModifier) {
        if (e.code === 'KeyZ') {
          e.preventDefault();
          if (e.shiftKey) redo(); else undo();
        } else if (e.code === 'KeyY') {
          e.preventDefault();
          redo();
        }
      }
    });

    // ==========================================
    //           ГОЛОВНА ЛОГІКА РЕНДЕРУ (З ДЕБАУНСОМ)
    // ==========================================
    let renderTimer = null;

    function getPreparedHtml(code) {
      const trimmed = code.trim();
      if (!trimmed) return EMPTY_DARK_TEMPLATE;

      const hasDocType = /<!doctype/i.test(trimmed);
      const hasHtmlTag = /<html[\s>]/i.test(trimmed);

      if (!hasDocType && !hasHtmlTag) {
        return `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <style>
    html, body {
      background-color: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
    }
  </style>
</head>
<body>
  ${code}
</body>
</html>`;
      }

      if (!trimmed.includes('color-scheme')) {
        return trimmed.replace(/<head[\s>]/i, '$&<meta name="color-scheme" content="dark">');
      }

      return trimmed;
    }

    function renderPreview() {
      iframe.srcdoc = getPreparedHtml(editor.value);
    }

    function schedulePreview(delay = 250) {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(renderPreview, delay);
    }

    editor.addEventListener('input', () => {
      const curTab = getActiveTab();
      if (curTab) curTab.code = editor.value;
      schedulePreview(250); // Дебаунс для безпечного рендеру 3D сцен
      saveHistoryState();
      updateLineNumbers();
      saveTabsToStorage();
    });

    // ==========================================
    //           LAYOUT & VIEWPORT CONTROLS
    // ==========================================
    function applyLayout(forceSide = false) {
      if (forceSide) isStacked = false;

      if (isStacked && isDesktop) {
        mainLayout.classList.add('layout-stacked');
        editorContainer.style.width = '100%';
        editorContainer.style.height = '50%';
        layoutIcon.innerHTML = `
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <line x1="3" y1="12" x2="21" y2="12"></line>
        `;
      } else {
        mainLayout.classList.remove('layout-stacked');
        editorContainer.style.width = '50%';
        editorContainer.style.height = '100%';
        layoutIcon.innerHTML = `
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <line x1="12" y1="3" x2="12" y2="21"></line>
        `;
      }
      layoutBtn.disabled = !isDesktop;
      fullscreenBtn.disabled = !isDesktop;
      updateView();
    }

    function updateView() {
      if (isDesktop) {
        previewContainer.classList.add('is-desktop');
        rotateBtn.disabled = true;
        rotateBtn.classList.remove('active');
        isLandscape = false;
        deviceSelect.style.display = 'none';

        const w = previewContainer.clientWidth;
        const h = previewContainer.clientHeight;
        dimDisplay.textContent = `Desktop (${w} × ${h})`;
      } else {
        previewContainer.classList.remove('is-desktop');
        rotateBtn.disabled = false;
        deviceSelect.style.display = 'inline-block';

        const w = isLandscape ? currentH : currentW;
        const h = isLandscape ? currentW : currentH;

        device.style.width = `${w}px`;
        device.style.height = `${h}px`;
        notch.style.display = isLandscape ? 'none' : 'block';

        const availW = previewContainer.clientWidth - 40;
        const availH = previewContainer.clientHeight - 40;
        const totalW = w + 4;
        const totalH = h + 4;

        let scale = Math.min(availW / totalW, availH / totalH);
        if (scale > 1) scale = 1;

        scaler.style.transform = `scale(${scale})`;
        const pct = Math.round(scale * 100);
        dimDisplay.textContent = `${w} × ${h} (${pct}%)`;
      }
    }

    btnModeDesktop.addEventListener('click', () => {
      isDesktop = true;
      btnModeDesktop.classList.add('active');
      btnModeMobile.classList.remove('active');
      applyLayout();
    });

    btnModeMobile.addEventListener('click', () => {
      isDesktop = false;
      btnModeMobile.classList.add('active');
      btnModeDesktop.classList.remove('active');
      const [w, h] = deviceSelect.value.split('x').map(Number);
      currentW = w;
      currentH = h;
      applyLayout(true);
    });

    deviceSelect.addEventListener('change', () => {
      const [w, h] = deviceSelect.value.split('x').map(Number);
      currentW = w;
      currentH = h;
      updateView();
    });

    rotateBtn.addEventListener('click', () => {
      if (isDesktop) return;
      isLandscape = !isLandscape;
      rotateBtn.classList.toggle('active', isLandscape);
      updateView();
    });

    layoutBtn.addEventListener('click', () => {
      if (!isDesktop) return;
      isStacked = !isStacked;
      applyLayout();
    });

    fullscreenBtn.addEventListener('click', () => {
      if (!isDesktop) return;
      if (!document.fullscreenElement) {
        previewContainer.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    document.addEventListener('fullscreenchange', updateView);

    // ==========================================
    //           RESIZER (ЗМІНА РОЗМІРУ)
    // ==========================================
    let isDragging = false;

    function stopDragging() {
      if (isDragging) {
        isDragging = false;
        document.body.classList.remove('is-resizing', 'is-stacked-resizing');
      }
    }

    resizer.addEventListener('mousedown', (e) => {
      e.preventDefault();
      if (window.getSelection) window.getSelection().removeAllRanges();
      isDragging = true;
      document.body.classList.add('is-resizing');
      if (isStacked && isDesktop) {
        document.body.classList.add('is-stacked-resizing');
      } else {
        document.body.classList.remove('is-stacked-resizing');
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const headerH = 40;
      if (isStacked && isDesktop) {
        const totalH = window.innerHeight - headerH;
        let percentage = ((e.clientY - headerH) / totalH) * 100;
        percentage = Math.max(15, Math.min(85, percentage));
        editorContainer.style.height = `${percentage}%`;
      } else {
        let percentage = (e.clientX / window.innerWidth) * 100;
        percentage = Math.max(15, Math.min(85, percentage));
        editorContainer.style.width = `${percentage}%`;
      }
      updateView();
    });

    window.addEventListener('mouseup', stopDragging);
    window.addEventListener('blur', stopDragging);

    const resizeObserver = new ResizeObserver(updateView);
    resizeObserver.observe(previewContainer);

    // Tab key 2 пробіли
    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        saveHistoryState(true);
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
        schedulePreview(0);
        updateLineNumbers();
        saveHistoryState(true);
        const curTab = getActiveTab();
        if (curTab) curTab.code = editor.value;
        saveTabsToStorage();
      }
    });

    // Початкова ініціалізація
    initTabs();
    applyLayout();
  </script>
</body>
</html>
