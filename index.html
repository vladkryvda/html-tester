<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewport Simulator & Editor</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --border: #27272a;
      --text: #a1a1aa;
      --text-active: #fafafa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Блокування виділення тексту та курсору над iframe під час перетягування */
    body.is-resizing,
    body.is-resizing * {
      user-select: none !important;
      -webkit-user-select: none !important;
    }
    body.is-resizing iframe {
      pointer-events: none !important;
    }

    header {
      height: 48px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--surface);
      font-size: 13px;
      flex-shrink: 0;
    }

    .controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn {
      background: #18181b;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      color: var(--text-active);
      border-color: #3f3f46;
    }

    .btn.active {
      background: #27272a;
      color: var(--text-active);
      border-color: #52525b;
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .dim-label {
      font-size: 11px;
      color: #71717a;
      font-family: monospace;
      margin-left: 8px;
    }

    main {
      flex: 1;
      display: flex;
      height: calc(100vh - 48px);
      overflow: hidden;
      flex-direction: row;
    }

    main.layout-stacked {
      flex-direction: column;
    }

    .editor-pane {
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    main.layout-stacked .editor-pane {
      width: 100%;
      height: 45%;
    }

    textarea {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: #d4d4d8;
      border: none;
      padding: 16px;
      font-family: "JetBrains Mono", Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: none;
      outline: none;
      tab-size: 2;
    }

    /* Роздільник (Слайдер ресайзу) */
    .resizer {
      background-color: var(--border);
      flex-shrink: 0;
      z-index: 20;
    }

    main:not(.layout-stacked) .resizer {
      width: 5px;
      height: 100%;
      cursor: col-resize;
    }

    main.layout-stacked .resizer {
      height: 5px;
      width: 100%;
      cursor: row-resize;
    }

    .preview-pane {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050507;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }

    .device-scaler {
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
    }

    .device-wrapper {
      position: relative;
      border: 2px solid #3f3f46;
      border-radius: 44px;
      background: #000;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .device-notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 22px;
      background: #000;
      border-radius: 14px;
      z-index: 10;
      border: 1px solid #1c1c1f;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
      border-radius: 42px;
    }

    /* Стилі для режиму Desktop */
    .preview-pane.is-desktop {
      padding: 0;
    }

    .is-desktop .device-scaler {
      width: 100%;
      height: 100%;
      transform: none !important;
    }

    .is-desktop .device-wrapper {
      width: 100% !important;
      height: 100% !important;
      border: none;
      border-radius: 0;
      box-shadow: none;
      background: transparent;
    }

    .is-desktop .device-notch {
      display: none !important;
    }

    .is-desktop iframe {
      border-radius: 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="controls">
      <button class="btn active" data-type="desktop">Desktop</button>
      <button class="btn" data-type="mobile" data-w="375" data-h="812">iPhone 13 mini</button>
      <button class="btn" data-type="mobile" data-w="393" data-h="852">iPhone 15/16 Pro</button>
      <button class="btn" data-type="mobile" data-w="360" data-h="800">Android Base</button>
      <span class="dim-label" id="dimensions-display">Desktop (Full)</span>
    </div>

    <div class="controls">
      <button class="btn" id="layout-btn">Layout: Side-by-Side</button>
      <button class="btn" id="clear-btn">Clear</button>
    </div>
  </header>

  <main id="main-layout">
    <section class="editor-pane" id="editor-container">
      <textarea id="code-input" spellcheck="false" placeholder="Встав свій HTML/CSS код сюди..."></textarea>
    </section>

    <!-- Роздільник між панелями -->
    <div class="resizer" id="resizer"></div>

    <section class="preview-pane is-desktop" id="preview-container">
      <div class="device-scaler" id="scaler">
        <div class="device-wrapper" id="device">
          <div class="device-notch" id="notch"></div>
          <iframe id="viewport-frame" sandbox="allow-scripts allow-modals"></iframe>
        </div>
      </div>
    </section>
  </main>

  <script>
    const mainLayout = document.getElementById('main-layout');
    const editorContainer = document.getElementById('editor-container');
    const editor = document.getElementById('code-input');
    const resizer = document.getElementById('resizer');
    const iframe = document.getElementById('viewport-frame');
    const device = document.getElementById('device');
    const scaler = document.getElementById('scaler');
    const previewContainer = document.getElementById('preview-container');
    const dimDisplay = document.getElementById('dimensions-display');
    const modeBtns = document.querySelectorAll('[data-type]');
    const layoutBtn = document.getElementById('layout-btn');
    const clearBtn = document.getElementById('clear-btn');

    let isDesktop = true;
    let currentW = 393;
    let currentH = 852;
    let isStacked = false;

    // Редактор стартує порожнім
    editor.value = localStorage.getItem('sim_code_clean') || '';

    // Миттєва візуалізація без затримок
    function renderPreview() {
      iframe.srcdoc = editor.value;
      localStorage.setItem('sim_code_clean', editor.value);
    }

    editor.addEventListener('input', renderPreview);

    function applyLayout(forceSide = false) {
      if (forceSide) isStacked = false;

      if (isStacked && isDesktop) {
        mainLayout.classList.add('layout-stacked');
        layoutBtn.textContent = 'Layout: Stacked';
        editorContainer.style.width = '100%';
      } else {
        mainLayout.classList.remove('layout-stacked');
        layoutBtn.textContent = 'Layout: Side-by-Side';
        editorContainer.style.height = '100%';
      }
      layoutBtn.disabled = !isDesktop;
      updateView();
    }

    function updateView() {
      if (isDesktop) {
        previewContainer.classList.add('is-desktop');
        const w = previewContainer.clientWidth;
        const h = previewContainer.clientHeight;
        dimDisplay.textContent = `Desktop (${w} × ${h} px)`;
      } else {
        previewContainer.classList.remove('is-desktop');
        device.style.width = `${currentW}px`;
        device.style.height = `${currentH}px`;

        const availW = previewContainer.clientWidth - 40;
        const availH = previewContainer.clientHeight - 40;
        const totalW = currentW + 4;
        const totalH = currentH + 4;

        let scale = Math.min(availW / totalW, availH / totalH);
        if (scale > 1) scale = 1;

        scaler.style.transform = `scale(${scale})`;
        const pct = Math.round(scale * 100);
        dimDisplay.textContent = `${currentW} × ${currentH} px (${pct}%)`;
      }
    }

    // Ресайзер (drag and drop)
    let isDragging = false;

    resizer.addEventListener('mousedown', (e) => {
      isDragging = true;
      document.body.classList.add('is-resizing');
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;

      if (isStacked && isDesktop) {
        const headerH = 48;
        const totalH = window.innerHeight - headerH;
        let percentage = ((e.clientY - headerH) / totalH) * 100;
        percentage = Math.max(15, Math.min(85, percentage));
        editorContainer.style.height = `${percentage}%`;
      } else {
        let percentage = (e.clientX / window.innerWidth) * 100;
        percentage = Math.max(15, Math.min(85, percentage));
        editorContainer.style.width = `${percentage}%`;
      }
      updateView();
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        document.body.classList.remove('is-resizing');
      }
    });

    const resizeObserver = new ResizeObserver(() => {
      updateView();
    });
    resizeObserver.observe(previewContainer);

    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        modeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if (btn.dataset.type === 'desktop') {
          isDesktop = true;
          applyLayout();
        } else {
          isDesktop = false;
          currentW = parseInt(btn.dataset.w);
          currentH = parseInt(btn.dataset.h);
          applyLayout(true); // Завжди повертати у Side-by-Side для мобільних
        }
        updateView();
      });
    });

    layoutBtn.addEventListener('click', () => {
      if (!isDesktop) return;
      isStacked = !isStacked;
      applyLayout();
    });

    // Підтримка табуляції клавішею Tab
    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
        renderPreview();
      }
    });

    clearBtn.addEventListener('click', () => {
      editor.value = '';
      renderPreview();
    });

    applyLayout();
    renderPreview();
  </script>
</body>
</html>
